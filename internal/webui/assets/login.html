<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>INSIDE JOB · Sub-Panel</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="data:,">
  <style>
    *,*::before,*::after { box-sizing: border-box; }
    html,body { width: 100%; height: 100%; min-height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(circle at 18% 15%, rgba(37,99,235,.10), transparent 28%),
        radial-gradient(circle at 82% 80%, rgba(99,102,241,.08), transparent 30%),
        #f4f7fb;
      color: #172033;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 20px;
      overflow: auto;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .32;
      background-image:
        linear-gradient(rgba(148,163,184,.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148,163,184,.12) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: linear-gradient(to bottom, transparent, #000 22%, #000 78%, transparent);
    }
    .box {
      position: relative;
      width: 100%;
      max-width: 390px;
      background: rgba(255,255,255,.94);
      border: 1px solid rgba(203,213,225,.85);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 24px 70px rgba(15,23,42,.12), 0 3px 12px rgba(15,23,42,.05);
      backdrop-filter: blur(14px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-bottom: 8px;
    }
    .mark {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      border-radius: 13px;
      background: linear-gradient(145deg, #2563eb, #4f46e5);
      color: #fff;
      box-shadow: 0 9px 20px rgba(37,99,235,.25);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -.4px;
    }
    .eyebrow {
      margin: 0 0 2px;
      color: #64748b;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.8px;
    }
    h1 {
      margin: 0;
      font-size: 25px;
      line-height: 1.1;
      letter-spacing: .5px;
    }
    .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 16px 0 24px;
      padding-top: 14px;
      border-top: 1px solid #e8edf5;
      color: #64748b;
      font-size: 12px;
    }
    .version {
      padding: 4px 8px;
      border: 1px solid #dbe5f4;
      border-radius: 999px;
      background: #f8fafc;
      color: #334155;
      font: 600 11px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    form { margin: 0; }
    label {
      display: block;
      margin: 0 0 7px;
      color: #475569;
      font-size: 12px;
      font-weight: 650;
    }
    input {
      display: block;
      width: 100%;
      height: 43px;
      padding: 9px 12px;
      margin-bottom: 15px;
      border: 1px solid #d5deea;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      background: #fbfdff;
      color: #172033;
      transition: border-color .15s, box-shadow .15s, background .15s;
    }
    input:focus {
      outline: none;
      border-color: #3b82f6;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(59,130,246,.12);
    }
    button {
      display: block;
      width: 100%;
      height: 43px;
      margin-top: 4px;
      padding: 9px;
      border: 1px solid #2563eb;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      font-size: 14px;
      font-weight: 650;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 7px 16px rgba(37,99,235,.2);
      transition: background .15s, transform .15s, box-shadow .15s;
    }
    button:hover { background: #1d4ed8; box-shadow: 0 9px 20px rgba(37,99,235,.26); }
    button:active { transform: translateY(1px); }
    .err {
      margin-top: 10px;
      color: #dc2626;
      font-size: 13px;
      min-height: 18px;
    }
    .foot {
      margin-top: 16px;
      color: #94a3b8;
      text-align: center;
      font-size: 10px;
      letter-spacing: 1.2px;
    }
    @media (max-width: 480px) {
      body { padding: 14px; align-items: center; justify-content: center; }
      .box { max-width: 360px; padding: 25px 20px; border-radius: 14px; }
      h1 { font-size: 22px; }
      .meta { margin-bottom: 20px; }
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="brand">
      <div class="mark">IJ</div>
      <div>
        <p class="eyebrow">SUBSCRIPTION INTELLIGENCE</p>
        <h1>INSIDE JOB</h1>
      </div>
    </div>
    <div class="meta">
      <span>Sub-Panel Control Center</span>
      <span class="version">v0.1.82</span>
    </div>
    <form id="f" autocomplete="off">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" placeholder="Enter username" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="Enter password" autocomplete="off" required>
      <button type="submit">Sign in</button>
    </form>
    <div id="e" class="err"></div>
    <div class="foot">AUTHORIZED ACCESS ONLY</div>
  </div>
  <script>
    document.getElementById('f').addEventListener('submit', async e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const r = await fetch('/api/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username: fd.get('username'), password: fd.get('password')})
      });
      if (r.ok) {
        location.href = '/';
      } else {
        document.getElementById('e').textContent = 'Invalid credentials';
      }
    });
  </script>
</body>
</html>
