<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sign in</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="data:,">
  <style>
    *,*::before,*::after { box-sizing: border-box; }
    html,body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .box {
      width: 100%;
      max-width: 320px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 28px 24px;
    }
    form { margin: 0; }
    input {
      display: block;
      width: 100%;
      padding: 8px 10px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 3px;
      font-size: 14px;
      font-family: inherit;
      background: #fff;
      color: #333;
    }
    input:focus {
      outline: none;
      border-color: #888;
    }
    button {
      display: block;
      width: 100%;
      padding: 9px;
      border: 1px solid #999;
      border-radius: 3px;
      background: #f0f0f0;
      color: #333;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
    }
    button:hover { background: #e8e8e8; }
    button:active { background: #e0e0e0; }
    .err {
      margin-top: 12px;
      color: #c00;
      font-size: 13px;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <div class="box">
    <form id="f" autocomplete="off">
      <input name="username" type="text" placeholder="Username" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" required>
      <input name="password" type="password" placeholder="Password" autocomplete="off" required>
      <button type="submit">Sign in</button>
    </form>
    <div id="e" class="err"></div>
  </div>
  <script>
    document.getElementById('f').addEventListener('submit', async e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const r = await fetch('/api/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username: fd.get('username'), password: fd.get('password')})
      });
      if (r.ok) {
        location.href = '/';
      } else {
        document.getElementById('e').textContent = 'Invalid credentials';
      }
    });
  </script>
</body>
</html>
