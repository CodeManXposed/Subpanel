# Sub-Panel 默认配置(由 install.sh 复制到 /opt/Sub-Panel/config.yml)
# 注释里 ${VAR} 仅作说明用,YAML 本身不展开变量。

listen: "0.0.0.0:18443"          # 反代监听端口(对外订阅入口)
admin_listen: "127.0.0.1:19090"  # 管理面默认仅本机,公网访问建议走 VPN/SSH 隧道

# HMAC 盐文件,首次启动自动生成 32 字节随机
hmac_salt_file: "/opt/Sub-Panel/data/salt"

storage:
  sqlite_path: "/opt/Sub-Panel/data/sub-panel.db"
  retention:
    events: 180d          # 请求事件保留 180 天
    incidents: 180d       # 异常事件保留 180 天
    aws_ip_changes: 180d  # AWS 换 IP 记录及订阅者快照保留 180 天
  batch_flush_interval: 1s
  batch_flush_size: 100

# 前置 CDN / 真实 IP 解析
# Sub-Panel 推荐部署在 CDN 后面:
#   客户端 → CDN(HTTPS 证书/防护) → Sub-Panel :18443(HTTP 回源) → V2Board 上游
#
# 只有 RemoteAddr 命中 trust_proxies 时,Sub-Panel 才会读取 trust_headers。
# 不要把 0.0.0.0/0 加进 trust_proxies,否则公网用户可伪造 X-Forwarded-For。
# - 如果你用 Cloudflare 当 CDN,把 cloudflare 设为 true,
#   程序启动时会自动把 CF 全部 IP 段加进 trust_proxies,并优先读 CF-Connecting-IP。
# - 如果是其他 CDN / 自建 nginx 反代,把 CDN 回源 IP 段或反代机器 IP 填到 trust_proxies。
# - CDN 面板里建议透传 X-Real-IP 和 X-Forwarded-For;管理面「设置」页可查看当前诊断。
real_ip:
  cloudflare: false
  trust_headers:
    - "X-Real-IP"
    - "X-Forwarded-For"
  trust_proxies:
    - "127.0.0.1"
    - "::1"

# GeoIP(ip2region IPv4 xdb,放 tmpfs 后由进程加载到内存)
geoip:
  xdb_path: "/tmp/sub-panel/ip2region.xdb"
  asn_path: "/tmp/sub-panel/ip2asn-v4.tsv.gz"

# 管理员账号。install.sh 首装时会替换为随机密码对应的 bcrypt。
# 手工部署可用 `sub-panel hashpwd <密码>` 生成哈希。
admin:
  username: "admin"
  # 仅作手工配置示例;正式部署必须替换。
  password_hash: "$2a$10$4X17qnFIVcMqpszFGboBBeF0LMWDHxhR21dgL9UKU9EjjH0gtTBCG"

# PHP 源站硬保护：所有请求在反代前先过此关，超限立即 429，不排队、不访问源站。
rate_limit:
  global_rps: 200
  global_burst: 400
  upstream_max_concurrent: 64
  per_ip_max_concurrent: 3
  retry_after_seconds: 60

# 租户(订阅前置)。可以在管理面 → 租户管理 增删
tenants: []

# 检测规则种子(首次启动写入数据库,之后在管理面热更新)
detector:
  observe_only: false
  windows:
    short: 5m
    mid: 1h
    long: 24h
  rules:
    - name: token_freq_extreme
      desc: 单 token 5 分钟内 >=30 次
      when:
        token_freq:
          window: 5m
          gte: 30

    - name: ip_freq_burst
      desc: 单 IP 60 秒内 >=20 次，直接 429 且不访问源站
      action: rate_limit
      when:
        ip_freq:
          window: 1m
          gte: 20

    - name: ip_multi_token
      desc: 单 IP 10 分钟内 >=8 个不同 Token，直接 429 且不访问源站
      action: rate_limit
      when:
        ip_distinct_tokens:
          window: 10m
          gte: 8

    - name: token_multi_ip
      desc: 单 token 5 分钟多 IP
      when:
        token_distinct_ips:
          window: 5m
          gte: 5

    - name: cloud_ua_probe
      desc: 同一 token 在同一云厂商 IP 上短时间伪装多种客户端测活
      when:
        cloud_token_distinct_uas:
          window: 1m
          gte: 4
